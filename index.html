<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Kaun Banega Bhikhari</title>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--curtain:hsl(350 70% 14%);--curtain2:hsl(350 70% 22%);--tv:hsl(210 55% 18%);--acc:hsl(44 95% 55%);--chair:hsl(350 40% 30%);--ink:#fff8e7;--good:#35c46b;--bad:#e5484d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:var(--curtain);color:var(--ink);font-family:'Mukta',system-ui,sans-serif;font-size:16px}
body{background:radial-gradient(ellipse at 50% 0,var(--curtain2),var(--curtain) 70%) fixed}
h1,h2{font-family:'Rozha One',Georgia,serif;font-weight:400;margin:0}
main{max-width:640px;margin:0 auto;padding:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:2px solid var(--acc);background:transparent;border-radius:10px;padding:12px 16px;min-height:44px;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.go{background:var(--acc);color:#1a0b05;font-weight:700;text-align:center}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{background:#0006;border:1px solid #fff4;border-radius:8px;padding:10px;width:100%;min-height:44px}
label{display:block;margin:10px 0 4px;font-size:14px;opacity:.85}
.stack{display:grid;gap:10px}
.logo{position:relative;width:150px;height:150px;margin:24px auto 12px;display:grid;place-items:center}
.logo::before{content:"";position:absolute;inset:-40px;background:repeating-conic-gradient(from 0deg,var(--acc) 0 6deg,transparent 6deg 18deg);opacity:.35;border-radius:50%;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.logo span{position:relative;font-family:'Rozha One',serif;font-size:52px;border:5px solid var(--acc);padding:6px 16px;background:var(--curtain);border-radius:6px}
.title{text-align:center;font-size:32px;line-height:1.1;margin-bottom:24px}
.tv{background:var(--tv);border:10px solid #0c0c0f;border-radius:18px;padding:14px;box-shadow:0 0 0 2px var(--acc),0 10px 40px #000a;min-height:200px}
.tv .q{font-size:19px;font-weight:600;line-height:1.35;margin:0 0 12px}
.tv .meta{display:flex;justify-content:space-between;font-size:13px;opacity:.8;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opts button.right{background:var(--good);border-color:var(--good);color:#04200f}
.opts button.wrong{background:var(--bad);border-color:var(--bad)}
.opt{padding:10px 12px;border:1px solid #fff3;border-radius:8px}
.msg{min-height:26px;margin:10px 0;text-align:center;font-weight:700;color:var(--acc)}
.chairs{display:flex;justify-content:space-around;align-items:flex-end;margin-top:6px}
.seat{text-align:center;font-size:13px;width:90px}
.fig{position:relative;height:84px}
.head{width:30px;height:30px;border-radius:50%;background:#e8b98f;margin:0 auto}
.body{width:52px;height:38px;margin:2px auto 0;border-radius:14px 14px 4px 4px;background:var(--chair);border:2px solid var(--acc)}
.seat.host .body{background:#0b0b0b;border-color:#fff}
.base{width:70px;height:12px;margin:0 auto;background:var(--acc);border-radius:4px}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pad{border:1px solid #fff3;border-radius:12px;padding:8px}
.pad h3{margin:0 0 6px;font-size:15px}
.pad .row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pad button{text-align:center;padding:10px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid #fff2;text-align:left}
.scroll{overflow-x:auto}
.card{background:#0005;border:1px solid #fff2;border-radius:14px;padding:14px;margin:12px 0}
.tag{font-size:12px;border:1px solid var(--acc);border-radius:20px;padding:1px 8px;margin-left:6px}
.err{color:#fff;background:var(--bad);padding:8px 10px;border-radius:8px;margin:10px 0;font-weight:600}
.link{background:none;border:none;text-decoration:underline;padding:4px;min-height:44px}
@media (prefers-reduced-motion:no-preference){.logo::before{animation:spin 40s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}

/* landscape stage, characters, rotate prompt */
.tabs{display:flex;gap:8px;margin:10px 0}.tabs button{flex:1;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:10px 0}
.cc{text-align:center;padding:8px}.cfig{height:130px;margin-bottom:4px}
.fig{height:100%;width:auto;display:block;margin:0 auto;overflow:visible}
.set{display:grid;grid-template-columns:minmax(64px,1fr) minmax(0,3.2fr) minmax(64px,1.3fr);gap:8px;align-items:end;min-height:calc(100dvh - 20px);overflow:hidden}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.col.pl{flex-direction:row;align-items:flex-end;justify-content:space-around}
.pcol{display:flex;flex-direction:column;align-items:center;gap:4px}
.cwrap{height:min(36vh,160px)}
.lab{font-size:13px;text-align:center}
.mid{align-self:center}
.pf{transition:transform 2.2s ease-out}
.walk .pf{transform:translateX(var(--from))}
.walk.in .pf{transform:none}
.chairg{opacity:0;transition:opacity .5s}.seated .chairg{opacity:1}
.fig .l1,.fig .l2{transform-box:fill-box;transform-origin:50% 0}
.walking .l1{animation:step .35s infinite alternate}.walking .l2{animation:step .35s infinite alternate-reverse}
@keyframes step{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.fig .mouth{transform-box:fill-box;transform-origin:50% 50%}
.talk .mouth{animation:yap .16s infinite alternate}
@keyframes yap{from{transform:scaleY(.3)}to{transform:scaleY(1.6)}}
.mid .tv{min-height:0;padding:10px}.mid .tv .q{font-size:clamp(13px,3.4vh,18px);margin:0 0 8px}
.mid .opts{grid-template-columns:1fr 1fr}.mid .opt,.mid .opts button{font-size:clamp(12px,3vh,15px);padding:7px 9px;min-height:36px}
.pcol .row{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.pcol .row button{padding:8px 0;min-height:40px;text-align:center}
#rot{display:none;position:fixed;inset:0;z-index:50;background:var(--curtain);place-items:center;text-align:center;padding:24px;font-size:20px}
@media (orientation:portrait){body:has(#set) #rot{display:grid}}
body:has(#set) main{max-width:none;padding:8px 12px}
@media (prefers-reduced-motion:reduce){.pf{transition:none}.walking .l1,.walking .l2,.talk .mouth{animation:none}}

/* real-looking stage, chairs, wall TV, dance */
.set{position:relative;isolation:isolate}
.col,.mid{position:relative;z-index:1}
.bg{position:absolute;inset:-10px;z-index:0;pointer-events:none;overflow:hidden;background:linear-gradient(#030712,hsl(var(--h) 55% 9%) 60%,hsl(var(--h) 60% 6%))}
.bg i{position:absolute;display:block}
.bg .stars{inset:0;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.6px),radial-gradient(circle,hsl(var(--h) 90% 75%) 0 1.4px,transparent 2px);background-size:46px 46px,83px 83px;background-position:0 0,21px 37px;opacity:.55}
.bg .beams{inset:0;background:repeating-conic-gradient(from 165deg at 50% -8%,hsl(var(--h) 90% 60% / .22) 0 3deg,transparent 3deg 11deg);-webkit-mask:radial-gradient(ellipse at 50% 0,#000 25%,transparent 78%);mask:radial-gradient(ellipse at 50% 0,#000 25%,transparent 78%)}
.bg .ring{left:50%;top:16px;transform:translateX(-50%);width:min(46%,300px);padding:3px 0;text-align:center;border:2px solid var(--acc);border-radius:50%/60%;background:radial-gradient(#fff2,transparent 70%),hsl(var(--h) 60% 18%);box-shadow:0 0 18px hsl(var(--h) 90% 60% / .6),0 0 0 4px #0008;font:700 clamp(9px,2.4vh,13px) 'Rozha One',serif;letter-spacing:.14em;color:#fff}
.bg .floor{left:-12%;right:-12%;bottom:-22%;height:48%;border-radius:50%;background:repeating-radial-gradient(ellipse at 50% 50%,hsl(var(--h) 90% 55% / .35) 0 2px,transparent 2px 22px),radial-gradient(ellipse at 50% 30%,hsl(var(--h) 80% 40%),hsl(var(--h) 70% 14%) 70%);box-shadow:0 0 40px hsl(var(--h) 90% 55% / .5) inset,0 -4px 24px hsl(var(--h) 90% 55% / .35)}
.seatbox{position:relative;display:flex;justify-content:center}
.seatbox .cwrap{height:min(36vh,160px)}
.seatbox .cb,.seatbox .cf{position:absolute;left:50%;bottom:0;transform:translateX(-50%);pointer-events:none}
.seatbox .cb{z-index:1}.seatbox .pf{position:relative;z-index:2}.seatbox .cf{z-index:3}.seatbox.up .cf{z-index:0}
.chr{height:100%;width:auto;display:block;overflow:visible}
.ch.host .cb1{fill:#2a1a12}.ch.host .cb2{fill:#7a4a2a}
.ch.pl .cb1{fill:#10244d}.ch.pl .cb2{fill:#2d5fb8}
.ch .cleg{fill:#161616}
.mid .tv{background:linear-gradient(145deg,#1b1e24,#08090b 60%);border:7px solid #0b0b0d;border-radius:6px;box-shadow:0 0 0 1px #2a2d33,0 10px 30px #000c,0 0 36px hsl(var(--h) 90% 55% / .3);position:relative;padding:10px 10px 24px}
.mid .tv::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.07),transparent 38%);pointer-events:none}
.mid .tv::after{content:"";position:absolute;left:50%;bottom:7px;width:8px;height:8px;margin-left:-4px;border:2px solid #22d3ee;border-radius:50%;box-shadow:0 0 6px #22d3ee}
.armL,.armR{transform-box:fill-box;transform-origin:50% 6%}
.dance{animation:bounce .5s ease-in-out infinite alternate}
@keyframes bounce{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-14px) rotate(4deg)}}
.dance .armL{animation:wl .3s ease-in-out infinite alternate}.dance .armR{animation:wr .3s ease-in-out infinite alternate}
@keyframes wl{from{transform:rotate(-150deg)}to{transform:rotate(-100deg)}}
@keyframes wr{from{transform:rotate(150deg)}to{transform:rotate(100deg)}}
.dance .l1{animation:step .25s infinite alternate}.dance .l2{animation:step .25s infinite alternate-reverse}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-16px;width:8px;height:14px;animation:fall 2.4s linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.win{text-align:center;background:#000b;border:2px solid var(--acc);border-radius:14px;padding:12px 16px;box-shadow:0 0 30px hsl(var(--h) 90% 55% / .5);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.win h2{color:var(--acc);font-size:clamp(20px,6vh,34px);text-shadow:0 0 14px var(--acc);margin:2px 0 8px}.win p{margin:3px 0;font-size:14px}.trophy{font-size:clamp(28px,8vh,44px)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.set.two{grid-template-columns:minmax(64px,1fr) minmax(0,2.4fr) minmax(170px,2fr)}
.set.two .pcol .row button{min-height:44px;font-size:17px}
details summary{cursor:pointer;margin:8px 0}
@media (prefers-reduced-motion:reduce){.dance,.dance .armL,.dance .armR,.dance .l1,.dance .l2,.confetti i,.win{animation:none}}

/* big tap targets */
.set.two{grid-template-columns:minmax(56px,.8fr) minmax(0,2fr) minmax(240px,2.9fr)}
.pcol{flex:1;min-width:0}
.pcol .row{width:100%;grid-template-columns:1fr 1fr;gap:8px}
.pcol .row button{min-height:56px;font-size:24px;font-weight:700;border-width:3px;border-radius:12px;padding:6px 0}
.mid .opts button,.mid .opt{font-size:clamp(14px,3.4vh,17px);padding:10px 12px;min-height:46px}
.mid .opts{gap:10px}
.col.pl{gap:22px}
.pl .pcol:nth-child(1) .row button{border-color:#4da3ff;color:#cfe6ff}
.pl .pcol:nth-child(2) .row button{border-color:#ff9f43;color:#ffe2c4}
.pl .pcol:nth-child(1) .lab{color:#4da3ff;font-weight:700}
.pl .pcol:nth-child(2) .lab{color:#ff9f43;font-weight:700}

.micb{display:block;margin:2px auto 0;padding:6px 12px;min-height:40px;font-size:14px;text-align:center;border-radius:20px}

/* 3D stage */
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:none}
body:has(.set.g3) #gl{display:block}
body:has(.set.g3){background:#000 !important}
main{position:relative;z-index:1}
.set.g3 .bg{background:none}
.set.g3 .bg i:not(.ring){display:none}
.set.g3 .seatbox{visibility:hidden}
.set.g3 .confetti{display:none}
.set.g3 .win{padding:8px 12px}.set.g3 .win h2{font-size:clamp(18px,5vh,28px)}.set.g3 .win .trophy{font-size:clamp(22px,6vh,32px)}.set.g3 .win p{font-size:13px;margin:2px 0}
</style>
</head>

/* ---- Hinglish questions (options stay as in your English quiz) ---- */
const HG = {

      const dx = tx - lx, dy = -8.6, dz = tz - lz, th = Math.atan2(Math.hypot(dx, dz), -dy), psi = Math.atan2(-dx, -dz), len = Math.hypot(dx, dy, dz), col = i % 2 ? key : key2;
      idn(); tr(lx, 8.6, lz); ry(psi); rx(th); tr(0, -len / 2, 0); sc(1.7, len, 1.7); D(cone, col, .1, 1);
    }
    if (S.cele >= 0 && S.danceIdx >= 0 && S.seats[S.danceIdx + 1]) { const w = S.seats[S.danceIdx + 1]; idn(); tr(w.x, 8.6, w.z); sc(3.2, 8.6, 3.2); tr(0, -.5, 0); D(cone, [1, .9, .5], .2, 1); }
    gl.useProgram(PP.p); gl.uniformMatrix4fv(PP.u.uVP, false, VP); gl.uniform1f(PP.u.uPx, cv.height / (2 * Math.tan(FOV / 2)));
    gl.enableVertexAttribArray(1); drawPoints(stars.b, stars.n);
    let n = 0;
    for (let i = 0; i < 14; i++) { const ph = i / 14 * 6.283, o = n++ * 8; pd[o] = Math.cos(ph) * 8.6; pd[o+1] = 8.6; pd[o+2] = Math.sin(ph) * 8.6 - 1; const gcol = i % 2 ? key : [1, .93, .75]; pd[o+3] = gcol[0]; pd[o+4] = gcol[1]; pd[o+5] = gcol[2]; pd[o+6] = .75; pd[o+7] = .7; }
    for (const p of S.parts) { if (n >= MAXP) break; const o = n++ * 8, k = clamp(p.life / p.max, 0, 1); pd[o] = p.x; pd[o+1] = p.y; pd[o+2] = p.z; pd[o+3] = p.c[0]; pd[o+4] = p.c[1]; pd[o+5] = p.c[2]; pd[o+6] = Math.min(1, k * 2.6); pd[o+7] = p.size; }
    gl.bindBuffer(gl.ARRAY_BUFFER, pbuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, pd.subarray(0, n * 8)); drawPoints(pbuf, n);
    gl.depthMask(true); gl.disableVertexAttribArray(2);
  }
  requestAnimationFrame(frame);
  return {
    ok:true, dbg: () => JSON.stringify({parts:S.parts.length, first:S.parts[0], walkAt:S.walkAt, cele:S.cele, dance:S.danceIdx, lowq:S.lowq, slow:S.slow, w:cv.width, h:cv.height}),
    on: () => (typeof mem !== 'undefined' ? mem.gfx !== '2d' : true),
    talk: (who, on) => { S.talk[who] = on; },
    fx: ok => {
      const now = performance.now() / 1000, h = S.seats[0];
      if (ok) { S.flashOk = true; S.flash = .5; if (h) for (let i = 0; i < 70; i++) addP(h.x, 3.6 * h.s + 1, h.z, (Math.random() - .5) * 5, 2 + Math.random() * 4, (Math.random() - .5) * 3, [1, .8 + Math.random() * .2, .3], .3, 1.4, 5); }
      else { S.flashOk = false; S.flash = 1; S.shake = .55; if (h) for (let i = 0; i < 50; i++) addP(h.x + (Math.random() - .5) * 2, 3.4 * h.s, h.z, (Math.random() - .5) * 2, Math.random() * 2, (Math.random() - .5) * 2, [.6 + Math.random() * .3, .1, .08], .4, 1.8, -.4); }
    },
    sync: cfg => {
      const now = performance.now() / 1000; S.hue = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--h')) || 350;
      place();
      if (cfg.walk) { S.walkAt = now; S.introAt = now; S.seats.forEach(a => { a.sit = 0; }); }
      else if (S.walkAt >= 0 && now - S.walkAt >= 2.3) { S.walkAt = -1; }
      if (cfg.cele) { if (S.cele < 0) { S.cele = now; } S.danceIdx = cfg.dance == null ? -1 : cfg.dance; } else { S.cele = -1; S.danceIdx = -1; if (!cfg.walk) S.pulse = now; }
    }
  };
}

/* the stage: host on the left, TV in the middle, players on the right */
function scene(o) {
  const g3 = GL3.on(); if (g3) requestAnimationFrame(() => GL3.sync({walk: /walk/.test(o.cls), dance: o.dance, cele: !!o.confetti}));
  const pl = o.names.map((nm, p) => `<div class="pcol">${seat(SEL.chars[p] || ROSTER[0], false, p, 'pl', o.dance === p)}<div class="lab">${esc(nm)}</div>${(o.pads && o.pads[p]) || ''}</div>`).join('');
  return `<div class="set ${o.cls} ${o.names.length > 1 ? 'two' : ''} ${g3 ? 'g3' : ''}" id="set"><div class="bg"><i class="stars"></i><i class="beams"></i><i class="ring"><b>KAUN BANEGA BHIKHARI</b></i><i class="floor"></i></div>

}
function walkIn(then) {                // both characters walk to their chairs and sit; the host greets
  setTimeout(() => { const s = $('#set'); s && s.classList.add('in'); }, 80);
  setTimeout(() => { const s = $('#set'); if (s) { s.classList.remove('walking'); s.classList.add('seated'); } }, 2300);
  setTimeout(() => { const t = $('#sub'); if (t) t.textContent = greet(); sayGreet().then(then); }, 2700);
}

function start(id, multi) {
  const m = modes().find(x => x.id === id);
  if (multi && (!$('#n1').value.trim() || !$('#n2').value.trim())) { $('#nerr').textContent = 'Enter both names first'; return; }
  G = {m, qi:0, multi, names: multi ? [$('#n1').value.trim(), $('#n2').value.trim()] : [''],
       score: multi ? [0,0] : [0], right: [0,0], wrong: [0,0], locked: [false,false], over: false};
  theme(m.hue); SEL.host = hostPick(); SEL.solo = !multi;
  app.innerHTML = scene({cls:'walk walking', names: multi ? G.names : ['You'], mid:'<div class="tv"><p class="q" id="sub" style="text-align:center">KAUN BANEGA BHIKHARI</p></div>'});
  walkIn(ask);
}

function ask() {
  const {m, qi, multi} = G, q = qt(m, qi), L = 'ABCD';
  G.over = false; G.locked = [false,false];
  const mid = `<div class="tv"><div class="meta"><span>${esc(m.name)}</span><span>${qi + 1} / ${m.qs.length}</span></div>
   <p class="q">${esc(q.q)}</p>
   <div class="opts">${q.o.map((o, i) => multi
     ? `<div class="opt" id="o${i}">${L[i]}. ${esc(o)}</div>`
     : `<button id="o${i}" onclick="single(${i})">${L[i]}. ${esc(o)}</button>`).join('')}</div></div>
   <div class="msg" id="msg">${multi ? 'Fastest correct tap wins' : ''}</div>`;
  const pads = multi ? [0,1].map(p => `<div class="row">${[0,1,2,3].map(i => `<button id="p${p}${i}" onclick="tap(${p},${i})">${L[i]}</button>`).join('')}</div>`) : null;
  app.innerHTML = scene({cls:'in seated', names: multi ? G.names : ['You'], mid, pads});
  readQ(q);
}

function single(i) {
  if (G.over) return; G.over = true;
  const q = G.m.qs[G.qi], ok = i === q.a;
  $('#o' + q.a).classList.add('right'); if (!ok) $('#o' + i).classList.add('wrong');
  G.score[0] += ok ? CONFIG.RIGHT : CONFIG.WRONG; ok ? G.right[0]++ : G.wrong[0]++;
  $('#msg').textContent = ok ? 'Correct!' : 'Wrong. Correct answer: ' + 'ABCD'[q.a];
  Promise.all([announce(0, i, ok), sleep(1700)]).then(next);
}

function tap(p, i) {
  if (G.over || G.locked[p]) return;
  const q = G.m.qs[G.qi];
  if (i === q.a) {
    G.over = true; G.score[p] += CONFIG.RIGHT; G.right[p]++;
    $('#o' + q.a).classList.add('right');
    $('#msg').textContent = G.names[p] + ' was fastest!';
    Promise.all([announce(p, i, true), sleep(1700)]).then(next);
  } else {
    G.locked[p] = true; G.score[p] += CONFIG.WRONG; G.wrong[p]++;
    [0,1,2,3].forEach(k => $('#p' + p + k).disabled = true);
    $('#msg').textContent = G.names[p] + ' got it wrong';
    if (G.locked[0] && G.locked[1]) {
      G.over = true; $('#o' + q.a).classList.add('right');
      $('#msg').textContent = 'Nobody got it. Answer: ' + 'ABCD'[q.a];
      Promise.all([announce(p, i, false), sleep(1700)]).then(next);
    } else announce(p, i, false);
  }
}

function next() { G.qi++; G.qi < G.m.qs.length ? ask() : finish(); }

function finish() {
  stopVoice();
  if (G.multi) {
    const max = G.m.qs.length * CONFIG.RIGHT, s = G.score;
    record(G.names[0], G.m.name, s[0], G.right[0], G.wrong[0], 2);
    record(G.names[1], G.m.name, s[1], G.right[1], G.wrong[1], 2);
    return celebrate(G.names, s, G.right, G.wrong, max, () => { G = null; home(); });
  }
  app.innerHTML = `<h2>Quiz finished</h2><div class="card"><label>Enter your name to see your points</label>
  <input id="nm" maxlength="24" placeholder="Enter name"><div class="msg" id="nmerr"></div>
  <div class="stack"><button class="go" onclick="showSolo()">Show my points</button></div></div>`;
}

  const max = G.m.qs.length * CONFIG.RIGHT;
  record(name, G.m.name, G.score[0], G.right[0], G.wrong[0], 1);

function celebrate(names, s, r, w, max, done) {   // winner dances, winner text, confetti
  if (s[0] === s[1]) return resultScreen(names, s, r, w, max, done);
  stopVoice(); resultDone = done;
  const win = s[0] > s[1] ? 0 : 1;
  const mid = `<div class="win"><div class="trophy">🏆</div><h2>${esc(names[win])} is the winner!</h2>
   ${names.map((n, p) => `<p><b>${esc(n)}</b>: ${s[p]} out of ${max} points (${r[p]} right, ${w[p]} wrong)</p>`).join('')}

  app.innerHTML = scene({cls:'in seated', names, mid, dance:win, confetti:true});
  const wc = SEL.chars[win] || ROSTER[0];
  (async () => { if (!(await playLine((win === 1 ? 'u2' : 'u1') + 'W'))) await speak(winLine(wc), wc, win); })();
}

}

async function doLogin() {

      if (!d.ok) return login(d.error || 'Wrong ID or password');

}

function persist(note) {
  save();
  if (CONFIG.API_URL && hostCreds) {
    fetch(BASE() + '/modes', {method:'POST', body:JSON.stringify({id:hostCreds.id, pass:hostCreds.pw, modes:mem.modes, roles:mem.roles})})
      .then(r => r.json()).then(d => dash(d.ok ? note : 'Saved on this device only: ' + (d.error || 'server refused'))).catch(() => dash('Saved on this device only: cannot reach the server'));

function addMode() {
  const n = $('#mn').value.trim(); if (!n) return dash('Enter a mode name first');
  mem.modes.push({id:'m' + Date.now(), name:n, hue:+$('#mh').value, free:$('#mf').value === '1', price:+$('#mp').value || 0, qs:[]});

function addQ() {
  const o = [0,1,2,3].map(i => $('#qo' + i).value.trim()), q = $('#qq').value.trim();
  if (!q || o.some(x => !x)) return dash('Fill in the question and all four options');

function delMode(id) { mem.modes = mem.modes.filter(m => m.id !== id); persist('Mode deleted'); }
function setSound(k, inp) {
  const f = inp.files && inp.files[0]; if (!f) return;
  if (f.size > 1500000) return dash('That file is too big. Use a short sound under 1.5 MB.');
  const fr = new FileReader();
  fr.onload = () => {
    ac();
    if (CONFIG.API_URL && hostCreds) {
      fetch(BASE() + '/sound', {method:'POST', body:JSON.stringify({id:hostCreds.id, pass:hostCreds.pw, k, data:fr.result})})
        .then(r => r.json()).then(d => { mem.sounds[k] = 'server'; save(); delete BUF[k]; delete triedL[k]; dash(d.ok ? 'Recording saved for all players. Tap Play to test it.' : (d.error || 'Server refused the sound')); })
        .catch(() => dash('Cannot reach the server'));
    } else { mem.sounds[k] = fr.result; save(); delete BUF[k]; delete triedL[k]; dash('Recording saved on this device. Tap Play to test it.'); }
  };
  fr.readAsDataURL(f);
}

/* ---- play with a friend: same screen, or an invite code ---- */
const MIC = {st:'idle', pc:null, local:null, offer:null, muted:false, seen:{}, audio:null};
const MICTXT = {idle:'🎤 Join voice chat', ask:'Allow the microphone…', conn:'Connecting voice…', on:'🎤 Mic on (tap to mute)', mute:'🔇 Muted (tap to unmute)', err:'🎤 Mic blocked. Tap to retry'};
const micHTML = () => `<button class="micb" id="micBtn" onclick="micToggle()">${MICTXT[MIC.st]}</button>`;
function micSet(st) { MIC.st = st; const b = $('#micBtn'); if (b) b.textContent = MICTXT[st]; }
function micStop() {
  try { MIC.pc && MIC.pc.close(); MIC.local && MIC.local.getTracks().forEach(t => t.stop()); if (MIC.audio) MIC.audio.srcObject = null; } catch(e) {}
  Object.assign(MIC, {st:'idle', pc:null, local:null, offer:null, muted:false, seen:{}, audio:null});
}
const iceDone = pc => new Promise(r => { if (pc.iceGatheringState === 'complete') return r(); pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === 'complete') r(); }; setTimeout(r, 4000); });
async function micToggle() {            // each player taps once to join; tap again to mute or unmute
  if (!CONFIG.API_URL || !NET) return;
  if (MIC.st === 'on' || MIC.st === 'mute') {
    MIC.muted = !MIC.muted; MIC.local.getAudioTracks().forEach(t => { t.enabled = !MIC.muted; }); return micSet(MIC.muted ? 'mute' : 'on');
  }
  if (MIC.st === 'ask' || MIC.st === 'conn') return;
  micSet('ask');
  try { MIC.local = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); } catch(e) { return micSet('err'); }
  micSet('conn');
  const pc = MIC.pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  MIC.local.getTracks().forEach(t => pc.addTrack(t, MIC.local));
  pc.ontrack = e => { const a = MIC.audio || (MIC.audio = new Audio()); a.srcObject = e.streams[0]; a.play().catch(() => {}); };
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'connected') micSet(MIC.muted ? 'mute' : 'on'); else if (pc.connectionState === 'failed') micSet('err'); };
  if (me === 0) { await pc.setLocalDescription(await pc.createOffer()); await iceDone(pc); NET.sig(JSON.stringify(pc.localDescription)); }
  else if (MIC.offer) micAnswer();
}
async function micAnswer() {
  const o = MIC.offer, pc = MIC.pc; MIC.offer = null;
  await pc.setRemoteDescription(JSON.parse(o)); await pc.setLocalDescription(await pc.createAnswer()); await iceDone(pc); NET.sig(JSON.stringify(pc.localDescription));
}
async function micGotSig(msg, from) {   // the other player's signal arrived from the server
  if (!msg || MIC.seen[from] === msg) return; MIC.seen[from] = msg;
  if (me === 1) { MIC.offer = msg; if (MIC.pc) micAnswer(); }
  else if (MIC.pc) { try { await MIC.pc.setRemoteDescription(JSON.parse(msg)); } catch(e) {} }
}
let R = null, me = 0, NET = null, sig = '', nxt = -1, heard = null, savedOnline = false, introShown = false, readFor = -1;
const NOROOM = 'Invite codes work on your live game server. Inside claude.ai they work between signed-in people who were invited to this page.';
const post = b => fetch(BASE() + '/room', {method:'POST', body:JSON.stringify(b)}).then(r => r.json());
const newCode = () => Array.from({length:5}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');
function resetNet() { micStop(); try { if (NET) NET.stop(); } catch(e) {} NET = null; R = null; sig = ''; nxt = -1; heard = null; savedOnline = false; introShown = false; readFor = -1; }

function friendMenu() {
  theme(350); resetNet();
  app.innerHTML = `<h2>Play with a friend</h2><div class="stack" style="margin-top:14px">
  <button class="go" onclick="flow('two', () => pickMode(true))">Same screen</button>
  <button class="go" onclick="flow('online', pickOnline)">Create an invite code</button>
  <button class="go" onclick="flow('online', joinScreen)">Join with a code</button>
  <button class="link" onclick="home()">Back</button></div>`;
}
function fail(msg) {
  resetNet();
  app.innerHTML = `<h2>Could not continue</h2><div class="card"><p>${esc(msg || '')}</p></div><button class="link" onclick="friendMenu()">Back</button>`;
}
function pickOnline() {
  theme(350);
  app.innerHTML = `<h2>Create an invite code</h2><label>Your name</label><input id="on" maxlength="24" placeholder="Enter name"><div class="msg" id="oerr"></div>
  <div class="stack" style="margin-top:14px">${modes().map(m => `<button ${m.qs.length ? '' : 'disabled'} onclick="createRoom('${m.id}')">${esc(m.name)}</button>`).join('')}
  <button class="link" onclick="friendMenu()">Back</button></div>`;
}
function joinScreen() {
  theme(350);
  app.innerHTML = `<h2>Join with a code</h2><label>Invite code</label><input id="jc" maxlength="5" autocapitalize="characters" autocomplete="off">
  <label>Your name</label><input id="jn" maxlength="24" placeholder="Enter name"><div class="msg" id="jerr"></div>
  <div class="stack" style="margin-top:14px"><button class="go" onclick="joinRoom()">Join game</button><button class="link" onclick="friendMenu()">Back</button></div>`;
}

/* transport 1: your server (main.py) */
function serverNet(code) {
  const tick = () => fetch(BASE() + '/room?code=' + code).then(r => r.json()).then(d => { if (d.ok) { R = d.room; draw(); if (R.sg && R.sg[String(1 - me)]) micGotSig(R.sg[String(1 - me)], 1 - me); } }).catch(() => {});
  tick(); const t = setInterval(tick, 500);
  return {tap: i => post({action:'answer', code, p:me, i}).then(tick).catch(() => {}),
          next: q => post({action:'next', code, qi:q}).catch(() => {}),
          sig: msg => post({action:'sig', code, p:me, msg}).catch(() => {}),
          stop: () => clearInterval(t)};
}

/* transport 2: claude.ai live room (the first player's page keeps score) */
async function getRoom() {
  try { if (window.claude && claude.use) return await Promise.race([claude.use('room'), new Promise(r => setTimeout(() => r(null), 4000))]); } catch(e) {}
  return null;
}
const rname = c => 'kbb-' + c.toLowerCase();
function pub(S) {
  const cur = S.qs[S.qi], q = {q:cur.q, o:cur.o};
  if (S.over) q.a = cur.a;
  return {code:S.code, names:S.names, ch:S.ch, hc:S.hc, hue:S.hue, mode:S.mode, mid:S.mid, qi:S.qi, total:S.total, score:S.score, right:S.right, wrong:S.wrong,
          locked:S.locked, over:S.over, done:S.done, ev:S.ev, last:S.last, q};
}
async function roomHost(rc, S) {
  const rm = await rc.join(rname(S.code));
  let p2 = null, lastN = 0;
  const publish = () => { R = pub(S); draw(); rm.presence({role:'host', g:R, p2}).catch(() => {}); };
  const apply = (p, qi, i) => {
    if (!S.names[1] || S.over || S.done || qi !== S.qi || S.locked[p]) return;
    const ok = i === S.qs[S.qi].a; S.ev++;
    if (ok) { S.score[p] += CONFIG.RIGHT; S.right[p]++; S.over = true; }
    else { S.score[p] += CONFIG.WRONG; S.wrong[p]++; S.locked[p] = true; if (S.locked[0] && S.locked[1]) S.over = true; }
    S.last = {p, ok, i, n:S.ev}; publish();
  };
  const advance = qi => {
    if (!S.over || S.done || qi !== S.qi) return; S.ev++;
    if (S.qi + 1 >= S.total) S.done = true; else { S.qi++; S.over = false; S.locked = [false, false]; }
    publish();
  };
  rm.onPeers(ch => {
    for (const pe of ch.peers) {
      const pr = pe.presence || {};
      if (pr.role !== 'guest') continue;
      if (!p2) { p2 = pe.peer; S.names[1] = String(pr.name || 'Player 2').slice(0, 24); S.ch[1] = String(pr.ch || 'shakti'); S.ev++; publish(); }
      if (pe.peer === p2 && pr.ans && pr.ans.n > lastN) { lastN = pr.ans.n; apply(1, pr.ans.qi, pr.ans.i); }
    }
  });
  publish();
  return {tap: i => apply(0, S.qi, i), next: advance, stop: () => rm.leave().catch(() => {})};
}
async function roomGuest(rc, code, name) {
  const rm = await rc.join(rname(code));
  let n = 0, seen = false;
  const timer = setTimeout(() => { if (!seen) { try { rm.leave(); } catch(e) {} fail('Room not found. Check the code and ask your friend to keep the game open.'); } }, 8000);
  rm.presence({role:'guest', name, ch:SEL.chars[0].id}).catch(() => {});
  rm.onPeers(ch => {
    const h = ch.peers.find(pe => pe.presence && pe.presence.role === 'host' && pe.presence.g), mine = ch.peers.find(pe => pe.sameTab);
    if (!h) return;
    if (h.presence.p2 && mine && h.presence.p2 !== mine.peer) { clearTimeout(timer); return fail('This room is full'); }
    seen = true; R = h.presence.g; draw();
  });
  return {tap: i => { n++; rm.presence({ans:{n, qi:R.qi, i}}).catch(() => {}); }, next: () => {}, stop: () => { clearTimeout(timer); rm.leave().catch(() => {}); }};
}

async function createRoom(id) {
  const m = modes().find(x => x.id === id), nm = $('#on').value.trim();
  if (!nm) { $('#oerr').textContent = 'Enter your name first'; return; }
  resetNet(); me = 0; SEL.host = hostPick();
  app.innerHTML = '<p class="msg">Creating room…</p>';
  try {
    if (CONFIG.API_URL) {
      const d = await post({action:'create', name:nm, ch0:SEL.chars[0].id, hc:SEL.host.id, mode:{id:m.id, name:m.name, hue:m.hue, qs:m.qs}});
      if (!d.ok) return fail(d.error);
      NET = serverNet(d.code);
    } else {
      const rc = await getRoom(); if (!rc) return fail(NOROOM);
      const S = {code:newCode(), names:[nm, null], ch:[SEL.chars[0].id, null], hc:SEL.host.id, mode:m.name, mid:m.id, hue:m.hue, qs:m.qs.map(q => ({q:q.q, o:q.o, a:q.a})), qi:0, total:m.qs.length,
                 score:[0,0], right:[0,0], wrong:[0,0], locked:[false,false], over:false, done:false, ev:0, last:null};
      NET = await roomHost(rc, S);
    }
  } catch(e) { fail('Could not start the room. Try again.'); }
}
async function joinRoom() {
  const code = $('#jc').value.trim().toUpperCase(), nm = $('#jn').value.trim();
  if (!code || !nm) { $('#jerr').textContent = 'Enter the code and your name'; return; }
  resetNet(); me = 1;
  app.innerHTML = '<p class="msg">Joining…</p>';
  try {
    if (CONFIG.API_URL) {
      const d = await post({action:'join', code, name:nm, ch1:SEL.chars[0].id});
      if (!d.ok) return fail(d.error);
      NET = serverNet(code);
    } else {
      const rc = await getRoom(); if (!rc) return fail(NOROOM);
      NET = await roomGuest(rc, code, nm);
    }
  } catch(e) { fail('Could not join the room. Try again.'); }
}
function leave() { home(); }

function draw() {
  if (!R) return;
  SEL.solo = false;
  const find = id => roster().find(c => c.id === id) || ROSTER[0];
  if (R.ch) { SEL.chars = [find(R.ch[0]), find(R.ch[1] || 'shakti')]; SEL.host = find(R.hc); }
  if (heard === null) heard = R.last ? R.last.n : 0;
  else if (R.last && R.last.n > heard) { heard = R.last.n; announce(R.last.p, R.last.i, R.last.ok); }
  const k = JSON.stringify([R.ev, R.qi, R.names, R.over, R.done]);
  if (k === sig) return; sig = k; theme(R.hue);
  if (!R.names[1]) return lobby();
  if (R.done) return finishOnline();
  stage();
  if (R.over && nxt !== R.qi) { nxt = R.qi; const q = R.qi; setTimeout(() => { if (NET) NET.next(q); }, 3400); }
}
function lobby() {
  app.innerHTML = `<h2>${me === 0 ? 'Invite your friend' : 'Joining…'}</h2><div class="card"><p>${me === 0 ? 'Share this code. Your friend taps “Join with a code” and types it in.' : 'Waiting for the game to start.'}</p>
  <h1 style="font-size:56px;letter-spacing:6px;text-align:center;color:var(--acc)">${esc(R.code)}</h1>
  <div class="stack">${me === 0 ? '<button class="go" onclick="shareCode()">Share on WhatsApp or copy</button>' : ''}<button class="link" onclick="leave()">Cancel</button></div></div>
  <div class="msg">${me === 0 ? 'Waiting for your friend…' : ''}</div>`;
}
function shareCode() {
  const t = 'Join my Kaun Banega Bhikhari game with code ' + R.code;
  try { navigator.share ? navigator.share({text:t}) : navigator.clipboard.writeText(t); } catch(e) {}
}
function stage() {
  const q = SEL.lang === 'hi' && HI[R.mid] && HI[R.mid][R.qi] ? {q:HI[R.mid][R.qi][0], o:HI[R.mid][R.qi][1]} : SEL.lang === 'hg' && HG[R.mid] && HG[R.mid][R.qi] ? {q:HG[R.mid][R.qi], o:R.q.o} : R.q, L = 'ABCD', mine = R.locked[me];
  G = {names:R.names};
  const msg = R.over ? (R.last && R.last.ok ? R.names[R.last.p] + ' was fastest!' : 'Nobody got it. Answer: ' + L[R.q.a]) : (mine ? 'Wrong. Wait for your friend' : 'Fastest correct tap wins');
  const mid = `<div class="tv"><div class="meta"><span>${esc(R.mode)}</span><span>${R.qi + 1} / ${R.total}</span></div>
   <p class="q" id="sub">${esc(q.q)}</p><div class="opts">${q.o.map((o, i) => `<div class="opt" ${R.over && i === R.q.a ? 'style="background:var(--good);color:#04200f"' : ''}>${L[i]}. ${esc(o)}</div>`).join('')}</div></div>
   <div class="msg" id="msg">${esc(msg)}</div>${CONFIG.API_URL ? micHTML() : ''}`;
  const pads = [0,1].map(p => p === me ? `<div class="row">${[0,1,2,3].map(i => `<button ${mine || R.over ? 'disabled' : ''} onclick="onlineTap(${i})">${L[i]}</button>`).join('')}</div>` : '');
  const first = !introShown; introShown = true;
  app.innerHTML = scene({cls: first ? 'walk walking' : 'in seated', names:R.names, mid, pads});
  if (first) {
    readFor = R.qi;
    setTimeout(() => { const s = $('#set'); s && s.classList.add('in'); }, 80);
    setTimeout(() => { const s = $('#set'); if (s) { s.classList.remove('walking'); s.classList.add('seated'); } }, 2300);
    setTimeout(() => { const m2 = $('#msg'); if (m2) m2.textContent = greet(); sayGreet().then(() => readQ(q)); }, 2700);
  } else if (readFor !== R.qi) { readFor = R.qi; readQ(q); }
}
function onlineTap(i) { if (R && NET && !R.over && !R.locked[me]) NET.tap(i); }
function finishOnline() {
  stopVoice();
  if (!savedOnline) {
    savedOnline = true;
    record(R.names[me], R.mode, R.score[me], R.right[me], R.wrong[me], 2);
    const n = NET; setTimeout(() => { try { n && n.stop(); } catch(e) {} }, 4000);
  }
  celebrate(R.names, R.score, R.right, R.wrong, R.total * CONFIG.RIGHT, () => { home(); });
}

/* count visits and load host-made modes from the server */
if (CONFIG.API_URL) {
  try { fetch(API(), {method:'POST', body:JSON.stringify({type:'visit'})}).catch(() => {}); } catch(e) {}
  fetch(BASE() + '/modes').then(r => r.json()).then(d => { if (d.ok) { mem.modes = d.modes; if (d.roles) mem.roles = d.roles; } }).catch(() => {});
}
home();
